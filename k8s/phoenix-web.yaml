apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-web-deployment
  namespace: phoenix-system
  labels:
    app: phoenix-web
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: phoenix-web
  template:
    metadata:
      labels:
        app: phoenix-web
    spec:
      containers:
        - name: phoenix-web
          image: phoenix-os-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: phoenix-config
            - secretRef:
                name: phoenix-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-web-service
  namespace: phoenix-system
  labels:
    app: phoenix-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: phoenix-web
