apiVersion: apps/v1
kind: Deployment
metadata:
  name: combat-engine-deployment
  namespace: phoenix-system
  labels:
    app: combat-engine
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: combat-engine
  template:
    metadata:
      labels:
        app: combat-engine
    spec:
      containers:
        - name: combat-engine
          image: phoenix-combat-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: phoenix-config
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "600m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: combat-engine-service
  namespace: phoenix-system
  labels:
    app: combat-engine
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: combat-engine
